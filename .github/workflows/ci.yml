name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # `prisma validate` only needs the env var to exist to resolve the
  # datasource URL — it does not open a connection. No real DB in CI.
  DATABASE_URL: 'postgresql://user:pass@localhost:5432/quibly'

jobs:
  # ── apps/api + packages/shared ────────────────────────────────────────
  # This is the blocking gate for Fase 0 / Bloco 1: lint, typecheck, test,
  # and `prisma validate` must all be green before a PR touching the
  # backend or the shared package can merge.
  backend:
    name: api + shared (lint, typecheck, test, prisma validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (whole workspace — npm workspaces requires a root install)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build @quibly/shared
        run: npm run build --workspace=packages/shared

      - name: Lint — packages/shared
        run: npm run lint --workspace=packages/shared

      - name: Lint — apps/api
        run: npm run lint:ci --workspace=apps/api

      - name: Typecheck — packages/shared
        run: npm run typecheck --workspace=packages/shared

      - name: Typecheck — apps/api
        run: npm run typecheck --workspace=apps/api

      - name: Test — packages/shared (vitest)
        run: npm run test --workspace=packages/shared

      - name: Test — apps/api (jest)
        run: npm run test --workspace=apps/api

      - name: prisma validate
        run: npx prisma validate --schema=apps/api/prisma/schema.prisma

  # ── migrations against a real Postgres ──────────────────────────────────
  # The `backend` job above deliberately has no database — its unit suite
  # mocks Prisma, and keeping it DB-free keeps it fast. But two things simply
  # cannot be checked without a real Postgres, and both of them are the
  # difference between a bad migration failing here or failing in production:
  #
  #   * that every migration applies to an empty database, in order. This is
  #     the exact command `railway.toml` runs before the API process starts
  #     (`npx prisma migrate deploy && node dist/main.js`), so a migration
  #     that dies halfway does not roll back quietly — it takes the API down
  #     and burns the 3 configured restart retries.
  #   * that `schema.prisma` and `migrations/` still agree. Prisma lets the
  #     schema be edited without generating a migration; everything typechecks
  #     and the unit suite passes, and production then 500s on a column the
  #     client expects and the database has never had.
  #
  # Blocking from the start. This job exists to gate the League -> Room +
  # Challenge migration, and a gate that does not block is decoration.
  migrations:
    name: migrations (prisma migrate deploy + drift check)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quibly
          POSTGRES_PASSWORD: quibly
          POSTGRES_DB: quibly_test
        ports:
          - 5432:5432
        # Without the healthcheck the job races the container and fails on a
        # connection refused that looks like a migration bug.
        options: >-
          --health-cmd "pg_isready -U quibly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Overrides the workspace-level placeholder: here it points at something
      # real and disposable.
      DATABASE_URL: 'postgresql://quibly:quibly@localhost:5432/quibly_test?schema=public'
      # `prisma migrate diff --from-migrations` replays the whole chain into a
      # scratch database to compare against. It must not be the one under test.
      SHADOW_DATABASE_URL: 'postgresql://quibly:quibly@localhost:5432/quibly_shadow?schema=public'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Create the shadow database
        run: |
          PGPASSWORD=quibly createdb -h localhost -U quibly quibly_shadow

      - name: Test — migrations (jest, real Postgres)
        run: npm run test:db --workspace=apps/api

  # ── apps/web + apps/mobile ──────────────────────────────────────────────
  # Informational only, on purpose: as of Fase 0 neither app has a working
  # lint setup (apps/web's `next lint` has no eslint config/deps installed;
  # apps/mobile has no lint or typecheck script at all yet). That's a
  # pre-existing gap outside apps/api/packages/shared, owned by the
  # mobile/web squads — see the Fase 0 handoff report. This job surfaces
  # status without blocking merges until they wire it up; flip
  # `continue-on-error` off once it's green.
  # ── apps/mobile ─────────────────────────────────────────────────────────
  # Blocking as of Fase 1: the mobile app now has a typecheck and a test suite
  # (the session heartbeat), so there is something real to gate on. Note what
  # this job does *not* prove — the native surfaces (Android foreground service,
  # iOS Live Activity) only behave meaningfully on a physical device, and no CI
  # runner can tell you whether a session survived the app being killed. That
  # check stays manual; see docs/API-SESSIONS.md and the Fase 1 mobile PR.
  mobile:
    name: mobile (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @quibly/shared
        run: npm run build --workspace=packages/shared

      - name: Typecheck — apps/mobile
        run: npm run typecheck --workspace=apps/mobile

      - name: Test — apps/mobile (vitest)
        run: npm run test --workspace=apps/mobile

  # ── apps/web ────────────────────────────────────────────────────────────
  # Still informational: `next lint` has no eslint config or deps installed.
  # Owned by whoever picks the web app back up.
  web:
    name: web (lint — informational until fixed)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: turbo run lint (web)
        run: npx turbo run lint --filter=@quibly/web
