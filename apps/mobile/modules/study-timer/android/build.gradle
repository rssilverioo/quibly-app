apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Template de módulo Expo **local**, não de módulo publicado. A primeira versão
// deste arquivo trazia `maven-publish`, `useExpoPublishing()` e um bloco
// `publishing { singleVariant(...) }` — coisas que só fazem sentido para um
// módulo que vai para o npm. Um módulo local não tem package.json nem versão a
// publicar, e o Gradle falha configurando uma publicação que não existe.
group = 'com.quibly.studytimer'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle",
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

android {
  namespace "com.quibly.studytimer"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    // Tipos de foreground service passaram a ser obrigatórios no Android 14
    // (API 34); o manifest declara `dataSync`, que é o que um cronômetro
    // sincronizando heartbeats com o servidor de fato é.
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
