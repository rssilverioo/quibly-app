apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'com.quibly.studytimer'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle",
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "com.quibly.studytimer"
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    // Foreground service types became mandatory in Android 14 (API 34); the
    // manifest declares `dataSync`, which is what a study timer syncing
    // heartbeats to a server actually is.
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }
  compileSdk safeExtGet("compileSdkVersion", 35)

  publishing {
    singleVariant("release") {
      withSourcesJar()
    }
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
